<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1a1a2e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Quem Sou Eu?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <section id="screen-play" class="screen active" aria-label="Jogo">
      <p class="hint" id="hint-play">Toque na tela ou em Parar</p>

      <div class="card-viewport" id="card-viewport">
        <div class="card-track" id="card-track"></div>
      </div>

      <div class="action-bar" id="action-bar">
        <button type="button" class="btn-primary" id="btn-action">Parar</button>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
